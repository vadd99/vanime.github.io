<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vadd Studio - Platform Streaming Animasi</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Modular -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/index.css">            
</head>
<body>

    <!-- Container Utama Layout (Diisi oleh main.js) -->
    <div id="layout-wrapper"></div>

    <!-- Template Konten Halaman Home -->
    <template id="page-content">
        <div class="home-page-wrapper">
            
            <!-- Hero Section (Banner Atas Dinamis) -->
            <header class="hero">
                <div class="hero-bg">
                    <!-- Image default sementara sebelum data Firebase masuk -->
                    <img id="hero-banner-img" src="https://via.placeholder.com/2000x800?text=Memuat+Banner..." alt="Latar Belakang Hero">
                    <div class="hero-gradient"></div>
                    <div class="hero-gradient-side"></div>
                </div>

                <div class="hero-content-wrapper">
                    <div class="hero-box">
                        <h1 class="hero-title" id="hero-title-text">Memuat...</h1>
                        <p class="hero-desc" id="hero-desc-text">
                            Silakan tunggu, sedang memuat data dari database Vadd Studio...
                        </p>
                        <div class="hero-buttons">
                            <!-- Link href akan diset otomatis oleh Javascript -->
                            <a href="#" id="hero-play-btn" class="btn-primary"><i class="fas fa-play"></i> Mulai Menonton</a>
                            <a href="#" class="btn-secondary"><i class="fas fa-bookmark"></i> Tambahkan</a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="main-container">
                
                <!-- Section: Rilis Terbaru (Ini bisa untuk episode nanti, kita skip dulu/biarkan statis sementara) -->
                <section>
                    <div class="section-header">
                        <h2 class="section-title border-primary">Episode Terbaru (Coming Soon)</h2>
                    </div>
                    <div class="carousel-wrapper">
                        <div class="carousel-container hide-scroll" style="color:#666; font-size:14px; padding:20px 0;">
                            Fitur daftar episode terbaru sedang dalam pengembangan...
                        </div>
                    </div>
                </section>

                <!-- Section: Daftar Semua Series (Dinamis dari Firebase) -->
                <section>
                    <div class="section-header">
                        <h2 class="section-title border-accent">Jelajahi Judul Animasi</h2>
                    </div>
                    <!-- Tempat render data series -->
                    <div class="poster-grid" id="series-grid-container">
                        <!-- Loading State -->
                        <div style="color:#9ca3af; padding: 20px 0;">Memuat daftar judul animasi...</div>
                    </div>
                </section>

            </main>
        </div>
    </template>

    <!-- Script Utama -->
    <script src="js/main.js"></script>
    <script type="module" src="js/index.js"></script>    
</body>
</html>
