<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Admin - Vadd Studio</title>
    
    <!-- Phosphor Icons (Untuk Icon, tidak perlu install apa-apa) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- ROOT VARIABLES (Warna Tema) --- */
        :root {
            --bg-main: #05110a;
            --bg-panel: #0a1f14;
            --bg-hover: #113320;
            --border-color: #1a3a26;
            --color-green: #4ade80;
            --color-orange: #f97316;
            --color-orange-hover: #ea580c;
            --color-text-main: #f3f4f6;
            --color-text-muted: #9ca3af;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- RESET & BASIC --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-main);
            color: var(--color-text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- LAYOUT --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- SIDEBAR COMPONENTS --- */
        .sidebar-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-main);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--bg-panel);
            border: 2px solid var(--color-green);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-green);
            font-size: 12px;
            font-weight: bold;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
        }
        .logo-text span:first-child { color: var(--color-green); }

        .close-sidebar-btn {
            display: none;
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .nav-menu {
            padding: 20px 12px;
            flex: 1;
            overflow-y: auto;
        }

        .nav-label {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-bottom: 10px;
            padding-left: 12px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: none;
            border: none;
            width: 100%;
            color: var(--color-text-muted);
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 5px;
            border-left: 4px solid transparent;
            transition: all 0.2s;
            text-align: left;
        }

        .nav-item:hover {
            background-color: var(--bg-hover);
            color: var(--color-text-main);
        }

        .nav-item.active {
            background-color: var(--bg-hover);
            color: var(--color-green);
            border-left-color: var(--color-green);
        }

        .nav-item i { font-size: 20px; }

        .system-divider {
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
            padding-top: 20px;
        }

        /* --- TOP HEADER --- */
        .top-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            color: var(--color-text-muted);
        }

        .search-box input {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px 8px 36px;
            color: var(--color-text-main);
            outline: none;
            width: 200px;
            transition: border 0.3s;
        }

        .search-box input:focus {
            border-color: var(--color-green);
        }

        .user-profile {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--bg-hover);
            border: 1px solid var(--color-green);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-green);
        }

        /* --- MAIN CONTENT AREA --- */
        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        /* Tab Content Control */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* --- DASHBOARD STYLES --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .stat-title {
            color: var(--color-text-muted);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .stat-indicator {
            font-size: 12px;
            color: var(--color-green);
        }

        .stat-desc {
            font-size: 12px;
            color: var(--color-text-muted);
            margin-top: 5px;
        }

        /* --- POSTS STYLES --- */
        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-primary {
            background-color: var(--color-orange);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }

        .btn-primary:hover {
            background-color: var(--color-orange-hover);
        }

        .posts-filter {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .filter-btn {
            background: none;
            border: none;
            color: var(--color-text-muted);
            padding-bottom: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: -1px;
            border-bottom: 2px solid transparent;
        }

        .filter-btn.active {
            color: var(--color-green);
            border-bottom-color: var(--color-green);
        }

        /* Posts List */
        .posts-list {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .post-item {
            display: flex;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            gap: 16px;
            align-items: center;
            transition: background 0.2s;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-item:hover {
            background-color: #0c2619;
        }

        .post-thumb {
            width: 150px;
            height: 85px;
            border-radius: 8px;
            background-color: var(--bg-hover);
            object-fit: cover;
        }

        .post-info {
            flex: 1;
            min-width: 0;
        }

        .post-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--color-text-muted);
            flex-wrap: wrap;
        }

        .post-category {
            background-color: rgba(17, 51, 32, 0.5);
            color: var(--color-green);
            border: 1px solid #2a5a3a;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .post-status {
            color: var(--color-orange);
            font-weight: 600;
        }

        .post-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--color-text-muted);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .action-btn:hover { background-color: var(--bg-hover); color: var(--color-text-main); }
        .action-btn.delete:hover { background-color: rgba(248, 113, 113, 0.1); color: #f87171; }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: -100%;
            }
            .sidebar.open {
                left: 0;
            }
            .close-sidebar-btn, .menu-btn {
                display: block;
            }
            .search-box {
                display: none; /* Sembunyikan pencarian di HP */
            }
            .post-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .post-thumb {
                width: 100%;
                height: 180px;
            }
            .post-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 10px;
            }
            /* Overlay */
            .overlay {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.6);
                z-index: 40;
            }
            .overlay.active { display: block; }
        }
    </style>
</head>
<body>

    <!-- Mobile Overlay -->
    <div class="overlay" id="mobileOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <div class="logo-icon">VS</div>
                <div class="logo-text"><span>vadd</span> <span>studio</span></div>
            </div>
            <button class="close-sidebar-btn" id="closeSidebar"><i class="ph ph-x"></i></button>
        </div>

        <nav class="nav-menu">
            <div class="nav-label">Menu Utama</div>
            <button class="nav-item active" data-tab="dashboard">
                <i class="ph ph-squares-four"></i> Dashboard
            </button>
            <button class="nav-item" data-tab="posts">
                <i class="ph ph-video-camera"></i> Postingan Video
            </button>
            <button class="nav-item">
                <i class="ph ph-chart-bar"></i> Statistik Detail
            </button>

            <div class="system-divider">
                <div class="nav-label">Sistem</div>
                <button class="nav-item">
                    <i class="ph ph-gear"></i> Pengaturan Situs
                </button>
            </div>
        </nav>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="main-wrapper">
        
        <!-- HEADER -->
        <header class="top-header">
            <div class="header-left">
                <button class="menu-btn" id="openSidebar"><i class="ph ph-list"></i></button>
                <h1 class="page-title" id="headerTitle">Ringkasan Dashboard</h1>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" placeholder="Cari...">
                </div>
                <div class="user-profile">
                    <i class="ph ph-user"></i>
                </div>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main class="content-area">
            
            <!-- TAB: DASHBOARD -->
            <div id="tab-dashboard" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-title">Total Kunjungan</div>
                        <div class="stat-value">124.5K <span class="stat-indicator">+12%</span></div>
                        <div class="stat-desc">Bulan ini</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Total Video</div>
                        <div class="stat-value">48</div>
                        <div class="stat-desc">Status Publik</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Komentar Baru</div>
                        <div class="stat-value" style="gap: 5px;">892 <span class="stat-indicator" style="color: var(--color-orange);">Review</span></div>
                        <div class="stat-desc">7 hari terakhir</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Waktu Tonton</div>
                        <div class="stat-value">8.2K <span style="font-size:14px; color:var(--color-text-muted);">Jam</span></div>
                        <div class="stat-desc">Bulan ini</div>
                    </div>
                </div>
                <!-- Placeholder area -->
                <div style="border: 1px dashed var(--border-color); padding: 40px; text-align: center; border-radius: 12px; color: var(--color-text-muted);">
                    <i class="ph ph-chart-line-up" style="font-size: 48px; margin-bottom: 10px; opacity: 0.5;"></i>
                    <p>Area Grafik Chart Akan Tampil Disini</p>
                </div>
            </div>

            <!-- TAB: POSTS -->
            <div id="tab-posts" class="tab-content">
                <div class="posts-header">
                    <div>
                        <h2 style="font-size: 20px; margin-bottom: 4px;">Daftar Video</h2>
                        <p style="font-size: 14px; color: var(--color-text-muted);">Kelola semua konten video yang ada di Vadd Studio.</p>
                    </div>
                    <button class="btn-primary" onclick="window.location.href='post.html'">
                        <i class="ph ph-plus"></i> Buat Postingan Baru
                    </button>
                </div>

                <div class="posts-filter">
                    <button class="filter-btn active">Semua (4)</button>
                    <button class="filter-btn">Publik (3)</button>
                    <button class="filter-btn">Draft (1)</button>
                </div>

                <div class="posts-list" id="postsContainer">
                    <!-- Postingan akan di-render oleh JavaScript di sini -->
                </div>
            </div>

        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Data Mockup Postingan
        let postsData = [
            { id: 1, title: "Kisah Hutan Hijau Eps 1", category: "Animasi", views: "12.4K", date: "12 Okt 2026", status: "Publik", thumbnail: "https://images.unsplash.com/photo-1618336753974-aae8e04506aa?auto=format&fit=crop&q=80&w=400&h=225" },
            { id: 2, title: "Dunia Paralel - Trailer Resmi", category: "Sci-Fi", views: "8.2K", date: "10 Okt 2026", status: "Publik", thumbnail: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&q=80&w=400&h=225" },
            { id: 3, title: "Clapperboard Merah: Di Balik Layar", category: "Dokumenter", views: "3.1K", date: "05 Okt 2026", status: "Draft", thumbnail: "https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?auto=format&fit=crop&q=80&w=400&h=225" },
            { id: 4, title: "Petualangan Sang Sutradara Rubah", category: "Animasi", views: "45.9K", date: "01 Okt 2026", status: "Publik", thumbnail: "https://images.unsplash.com/photo-1500829243541-74b676fecc20?auto=format&fit=crop&q=80&w=400&h=225" }
        ];

        // Render Data ke HTML
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = ''; // Bersihkan container

            if (postsData.length === 0) {
                container.innerHTML = '<div style="padding: 30px; text-align: center; color: var(--color-text-muted);">Tidak ada postingan.</div>';
                return;
            }

            postsData.forEach(post => {
                const draftBadge = post.status === 'Draft' ? `<span class="post-status">• ${post.status}</span>` : '';
                
                const postHTML = `
                    <div class="post-item">
                        <img src="${post.thumbnail}" alt="Thumbnail" class="post-thumb">
                        <div class="post-info">
                            <div class="post-title">${post.title}</div>
                            <div class="post-meta">
                                <span class="post-category">${post.category}</span>
                                <span><i class="ph ph-eye"></i> ${post.views}</span>
                                <span>• ${post.date}</span>
                                ${draftBadge}
                            </div>
                        </div>
                        <div class="post-actions">
                            <button class="action-btn" title="Lihat"><i class="ph ph-eye"></i></button>
                            <button class="action-btn" title="Edit"><i class="ph ph-pencil-simple"></i></button>
                            <button class="action-btn delete" title="Hapus" onclick="deletePost(${post.id})"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
                container.innerHTML += postHTML;
            });
        }

        // Fungsi Hapus Post
        function deletePost(id) {
            if(confirm("Apakah Anda yakin ingin menghapus postingan ini?")) {
                postsData = postsData.filter(post => post.id !== id);
                renderPosts();
            }
        }

        // Inisialisasi render pertama
        renderPosts();

        // --- SISTEM TAB (Berpindah Menu) ---
        const navItems = document.querySelectorAll('.nav-item');
        const tabContents = document.querySelectorAll('.tab-content');
        const headerTitle = document.getElementById('headerTitle');

        navItems.forEach(item => {
            item.addEventListener('click', function() {
                const targetTab = this.getAttribute('data-tab');
                if(!targetTab) return; // Abaikan menu yang belum ada tujuannya

                // Reset class aktif
                navItems.forEach(nav => nav.classList.remove('active'));
                tabContents.forEach(tab => tab.classList.remove('active'));

                // Set menu yang diklik menjadi aktif
                this.classList.add('active');
                document.getElementById('tab-' + targetTab).classList.add('active');

                // Ubah Judul Header
                if(targetTab === 'dashboard') headerTitle.textContent = "Ringkasan Dashboard";
                if(targetTab === 'posts') headerTitle.textContent = "Kelola Postingan";

                // Tutup sidebar di versi mobile setelah klik menu
                closeMobileSidebar();
            });
        });

        // --- SISTEM SIDEBAR MOBILE ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobileOverlay');
        const btnOpen = document.getElementById('openSidebar');
        const btnClose = document.getElementById('closeSidebar');

        function openMobileSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        }

        function closeMobileSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        btnOpen.addEventListener('click', openMobileSidebar);
        btnClose.addEventListener('click', closeMobileSidebar);
        overlay.addEventListener('click', closeMobileSidebar);

    </script>
</body>
</html>
