<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Memuat Video... - Vadd Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/player.css">
</head>
<body>

    <div id="layout-wrapper"></div>

    <template id="page-content">
        <div class="player-page-container">

            <!-- 1. Video Player Container -->
            <div class="video-player-wrapper">
                <div class="video-container" id="video-container">
                    
                    <!-- Tempat iFrame YouTube akan disuntikkan -->
                    <div id="embed-container" style="width: 100%; height: 100%; aspect-ratio: 16/9; display: none;"></div>

                    <!-- Mock Video Bawaan (Akan disembunyikan jika pakai YouTube) -->
                    <video id="main-video" poster="https://via.placeholder.com/1200x675?text=Memuat+Video...">
                        <source src="" type="video/mp4">
                    </video>

                    <div class="video-watermark" id="video-watermark">
                        <img src="logo.png" alt="Logo" style="width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; margin-right: 4px; border: 1px solid var(--vadd-primary);">
                        vadd<span>studio</span>
                    </div>

                    <button class="big-play-btn" id="big-play-btn"><i class="fas fa-play"></i></button>

                    <!-- Custom Video Controls -->
                    <div class="video-controls" id="video-controls">
                        <div class="progress-bar-container" id="progress-container">
                            <div class="buffer-bar" id="buffer-bar"></div>
                            <div class="progress-bar" id="progress-bar"></div>
                        </div>

                        <div class="controls-row">
                            <div class="controls-left">
                                <button class="control-btn" id="btn-play-pause"><i class="fas fa-play"></i></button>
                                <button class="control-btn" id="btn-skip-backward"><i class="fas fa-undo-alt"></i></button>
                                <button class="control-btn" id="btn-skip-forward"><i class="fas fa-redo-alt"></i></button>

                                <div class="volume-container">
                                    <button class="control-btn" id="btn-volume"><i class="fas fa-volume-up"></i></button>
                                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" class="volume-slider">
                                </div>

                                <span class="video-time" id="video-time">00:00 / 00:00</span>
                            </div>

                            <div class="controls-right">
                                <button class="control-btn badge-btn">CC</button>
                                <button class="control-btn"><i class="fas fa-cog"></i></button>
                                <button class="control-btn" id="btn-fullscreen"><i class="fas fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Informasi Episode -->
            <div class="player-info-container">

                <a href="#" id="ep-series-title" class="series-subtitle">Memuat Judul Seri...</a>
                <h1 class="episode-main-title" id="ep-main-title">Memuat Episode...</h1>

                <div class="episode-tags">
                    <span class="age-tag">14+</span>
                    <span class="sub-status"><i class="fas fa-closed-captioning"></i> Dengan Takarir</span>
                </div>

                <div class="interaction-toolbar">
                    <div class="like-dislike-group">
                        <button class="toolbar-btn" id="btn-like">
                            <i class="far fa-thumbs-up"></i> <span id="like-count">0</span>
                        </button>
                        <div class="divider"></div>
                        <button class="toolbar-btn" id="btn-dislike">
                            <i class="far fa-thumbs-down"></i> <span id="dislike-count">0</span>
                        </button>
                    </div>

                    <div class="action-tools">
                        <button class="toolbar-btn circle-btn" title="Unduh Offline" id="btn-download"><i class="fas fa-download"></i></button>
                        <button class="toolbar-btn circle-btn" title="Opsi Lainnya" id="btn-more-options"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                </div>

                <div class="episode-description">
                    <p id="ep-desc">Sedang mengambil deskripsi dari database...</p>
                </div>

                <div class="content-warning-box">
                    <h3 class="warning-title">Peringatan Konten</h3>
                    <p class="warning-tags">14+</p>
                    <p class="warning-details">Konten Animasi, Aksi</p>
                </div>

                <!-- Episode Berikutnya -->
                <div class="next-episode-section" id="next-ep-section" style="display: none;">
                    <h3 class="section-label">Episode Berikutnya</h3>

                    <a href="#" id="next-ep-link" class="next-episode-card">
                        <div class="next-thumb-wrapper">
                            <img id="next-ep-thumb" src="" alt="Thumbnail">
                            <div class="play-overlay-mini"><i class="fas fa-play"></i></div>
                        </div>

                        <div class="next-episode-info">
                            <h4 class="next-title" id="next-ep-title">Memuat...</h4>
                        </div>
                    </a>

                    <div class="all-episodes-link-wrapper">
                        <a href="#" id="btn-all-episodes" class="all-episodes-btn">Lihat Semua Episode</a>
                    </div>
                </div>

            </div>

            <div id="vadd-toast">Notifikasi!</div>
        </div>
    </template>

    <script src="js/main.js"></script>
    <script type="module" src="js/player.js"></script>
</body>
</html>
